  #     - run: secure-npm scan --ai --report --output json

  test:
    runs-on: ubuntu-22.04
    # strategy:
    #   matrix:
    #     node-version: [20, 22]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: branda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      restate:
        image: restatedev/restate:latest
        ports:
          - "8080:8080" # Ingress port (where Elysia talks to Restate)
          - "9070:9070" # Admin port
          - "9071:9071" # Introspection UI

      s3mock:
        image: adobe/s3mock:latest
        ports:
          - 9090:9090
        env:
          initialBuckets: branda-media

   
    steps:
      - uses: actions/checkout@v4
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
        working-directory: ${{ github.workspace }}

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: "oidc"
          identity-id: "4c15afc1-d148-4709-a098-248aa9d6ea0a"  # From Step 4
          project-slug: "branda"      # Your Infisical project slug
          env-slug: "test"                        # Your environment slug
          
      - name: Run migration
        env:
          DATABASE_URL: postgresql://root:root@localhost:5432/branda
        run: bun migrate
      # - name: Run server
      #   run: bun run src/index.ts 
      # - name: Wait for server
